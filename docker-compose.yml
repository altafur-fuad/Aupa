services:
  db:
    image: postgres:16-alpine
    container_name: aupa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aupa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - aupa_pgdata:/var/lib/postgresql/data
      - ./supabase/migrations/20261019000001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./supabase/migrations/20261019000002_rls_and_policies.sql:/docker-entrypoint-initdb.d/02_rls.sql:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aupa"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api-go
      dockerfile: Dockerfile
    container_name: aupa-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENVIRONMENT: "development"
      CURRENCY: "BDT"
      DATABASE_URL: "postgres://postgres:postgrespassword@db:5432/aupa?sslmode=disable"
      JWT_SECRET: "super-secure-local-docker-development-secret-key-32!"
      JWT_ISSUER: "aupa-api"
      JWT_AUDIENCE: "aupa-client"
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "168h"
    depends_on:
      db:
        condition: service_healthy

volumes:
  aupa_pgdata:
